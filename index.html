
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xtract AI | Future of Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Lenis Recommended CSS */
      html.lenis {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #030014;
        color: #ffffff;
        margin: 0;
        padding: 0;
      }
      
      /* Grain Texture Overlay */
      .grain::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.04;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #030014;
      }
      ::-webkit-scrollbar-thumb {
        background: #2e1065;
        border-radius: 10px;
        border: 2px solid #030014;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4c1d95;
      }

      /* Glowing background utility */
      .glow-mesh {
        background: radial-gradient(circle at 50% 50%, rgba(147, 51, 234, 0.15) 0%, rgba(3, 0, 20, 0) 50%);
      }

      :focus:not(:focus-visible) {
        outline: none;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "framer-motion": "https://esm.sh/framer-motion@^12.29.2",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "@studio-freight/lenis": "https://esm.sh/@studio-freight/lenis@^1.0.42"
      }
    }
    </script>
  </head>
  <body class="grain">
    <div id="root"></div>
  </body>
</html>
